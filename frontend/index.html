<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vox — 语音视觉智能体</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>vox</h1>
            <div id="status">
                <span id="status-dot" class="dot idle"></span>
                <span id="status-text">空闲</span>
            </div>
        </header>

        <main>
            <section id="chat-panel" aria-label="conversation">
                <div id="chat-log"></div>
                <form id="text-input-form">
                    <input id="text-input" type="text" placeholder="…或直接输入文字" autocomplete="off">
                    <button type="submit">发送</button>
                </form>
            </section>

            <aside id="vision-panel">
                <div id="camera-wrapper">
                    <video id="camera-preview" autoplay playsinline muted></video>
                    <div id="camera-overlay">
                        <span id="camera-label">眼睛</span>
                    </div>
                </div>
                <div id="last-snapshot-info">上次画面: <span id="snapshot-time">—</span></div>

                <div id="skills-panel">
                    <div id="skills-header">
                        <span>技能列表</span>
                        <button id="skills-refresh" title="刷新">↻</button>
                    </div>
                    <ul id="skills-list">
                        <li class="skills-empty">加载中…</li>
                    </ul>
                </div>
            </aside>
        </main>

        <footer>
            <button id="mic-toggle" class="primary">开启麦克风</button>
            <button id="cam-toggle">开启摄像头</button>
            <span class="hint">说点什么试试,或者用上方的文字框输入。</span>
        </footer>
    </div>

    <script src="js/voice.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
